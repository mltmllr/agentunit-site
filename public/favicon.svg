<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #080c16; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1220; }
    }
  </style>
  <!-- Substrate -->
  <rect class="bg" width="32" height="32" rx="6" fill="#080c16"/>
  <!-- Circuit traces -->
  <path d="M8 16h4l2-4h4l2 4h4" fill="none" stroke="#e8524e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 8v4" fill="none" stroke="#ff8c42" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16 20v4" fill="none" stroke="#ff8c42" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Junction nodes -->
  <circle cx="8" cy="16" r="2" fill="#e8524e" opacity="0.9"/>
  <circle cx="24" cy="16" r="2" fill="#e8524e" opacity="0.9"/>
  <circle cx="16" cy="8" r="1.5" fill="#ff8c42" opacity="0.8"/>
  <circle cx="16" cy="24" r="1.5" fill="#ff8c42" opacity="0.8"/>
  <!-- Center chip -->
  <rect x="12" y="12" width="8" height="8" rx="1.5" fill="none" stroke="#3a8da6" stroke-width="1" opacity="0.6"/>
  <rect x="14" y="14" width="4" height="4" rx="0.5" fill="#e8524e" opacity="0.7"/>
</svg>
